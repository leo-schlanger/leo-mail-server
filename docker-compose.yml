# Mail stack: Stalwart (SMTP/IMAP/JMAP server) + Bulwark (webmail).
# Lives at /opt/mail on the VPS. Secrets come from ./.env (see .env.example).
#
# Public ports (mail protocols) are published straight to the host so Stalwart
# sees the real client IP (needed for SPF/DMARC and auto-ban).
# HTTP is bound to localhost only and reached through the existing Traefik
# (host network, file provider) via traefik/mail.yml.
name: mail

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.27   # stay on 0.16: 1.x needs stalwart-migrate
    container_name: stalwart
    restart: unless-stopped
    hostname: mail.leoschlanger.com
    # Only Stalwart's own variables (no env_file: .env also holds the webmail
    # secrets). An empty STALWART_RECOVERY_ADMIN means "no break-glass admin".
    environment:
      STALWART_PUBLIC_URL: https://mail.leoschlanger.com
      # 1 = recovery mode (admin on :8080 only); used by scripts/configure.sh
      STALWART_RECOVERY_MODE: ${STALWART_RECOVERY_MODE:-0}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    ports:
      - "25:25"       # SMTP (receive mail from other servers)
      - "465:465"     # SMTP submission, implicit TLS (mail clients send)
      - "993:993"     # IMAP over TLS (mail clients read)
      - "127.0.0.1:8480:8080"   # HTTP: admin, JMAP, autoconfig -> Traefik
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
      # TLS cert/key exported from Traefik's acme.json by scripts/sync-certs.py
      - ./certs:/certs:ro
    networks:
      mail:
        ipv4_address: 172.30.50.10
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  bulwark:
    image: ghcr.io/bulwarkmail/webmail:1.21.3
    container_name: bulwark
    restart: unless-stopped
    depends_on: [stalwart]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      JMAP_SERVER_URL: https://mail.leoschlanger.com
      STALWART_FEATURES: "true"
      SESSION_SECRET: ${BULWARK_SESSION_SECRET:?set BULWARK_SESSION_SECRET in .env}
      SETTINGS_SYNC_ENABLED: "true"
      TRUSTED_PROXY_DEPTH: "1"
      BULWARK_TELEMETRY: "off"
      APP_NAME: ${BULWARK_APP_NAME:-Mail}
      LOGIN_COMPANY_NAME: ${BULWARK_APP_NAME:-Mail}
      LOGIN_WEBSITE_URL: https://leoschlanger.com
      LOGIN_SHOW_VERSION: "false"
    # Reach mail.leoschlanger.com through the host's Traefik instead of
    # hairpinning out to the public IP.
    extra_hosts:
      - "mail.leoschlanger.com:host-gateway"
    ports:
      - "127.0.0.1:8481:3000"
    volumes:
      - bulwark-settings:/app/data/settings
      - bulwark-admin:/app/data/admin
      - bulwark-admin-state:/app/data/admin-state
      - bulwark-telemetry:/app/data/telemetry
      - bulwark-plugin-secrets:/app/data/plugin-secrets
      - bulwark-version-check:/app/data/version-check
    networks: [mail]
    # Health check: the image's own (node healthcheck.mjs -> /api/health/live,
    # liveness only, so a Stalwart restart never marks the webmail unhealthy).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Webmail of olhaqueduas.com: same Stalwart, own hostname and branding
  # (webmail.olhaqueduas.com via traefik/olhaqueduas.yml), own settings volumes.
  bulwark-olhaqueduas:
    image: ghcr.io/bulwarkmail/webmail:1.21.3
    container_name: bulwark-olhaqueduas
    restart: unless-stopped
    depends_on: [stalwart]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      JMAP_SERVER_URL: https://mail.olhaqueduas.com
      STALWART_FEATURES: "true"
      SESSION_SECRET: ${BULWARK_OQD_SESSION_SECRET:?set BULWARK_OQD_SESSION_SECRET in .env}
      SETTINGS_SYNC_ENABLED: "true"
      TRUSTED_PROXY_DEPTH: "1"
      BULWARK_TELEMETRY: "off"
      APP_NAME: Olha que Duas Mail
      LOGIN_COMPANY_NAME: Olha que Duas
      LOGIN_WEBSITE_URL: https://olhaqueduas.com
      LOGIN_SHOW_VERSION: "false"
    extra_hosts:
      - "mail.olhaqueduas.com:host-gateway"
    ports:
      - "127.0.0.1:8482:3000"
    volumes:
      - bulwark-oqd-settings:/app/data/settings
      - bulwark-oqd-admin:/app/data/admin
      - bulwark-oqd-admin-state:/app/data/admin-state
      - bulwark-oqd-telemetry:/app/data/telemetry
      - bulwark-oqd-plugin-secrets:/app/data/plugin-secrets
      - bulwark-oqd-version-check:/app/data/version-check
    networks: [mail]
    # Health check: the image's own (node healthcheck.mjs -> /api/health/live,
    # liveness only, so a Stalwart restart never marks the webmail unhealthy).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  mail:
    ipam:
      config:
        - subnet: 172.30.50.0/24   # gateway 172.30.50.1 = where Traefik's traffic appears from

volumes:
  stalwart-etc:
  stalwart-data:
  bulwark-settings:
  bulwark-admin:
  bulwark-admin-state:
  bulwark-telemetry:
  bulwark-plugin-secrets:
  bulwark-version-check:
  bulwark-oqd-settings:
  bulwark-oqd-admin:
  bulwark-oqd-admin-state:
  bulwark-oqd-telemetry:
  bulwark-oqd-plugin-secrets:
  bulwark-oqd-version-check:
